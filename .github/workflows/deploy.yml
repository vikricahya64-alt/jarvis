# Deploy the Cloudflare Worker from GitHub when code changes are pushed to
# main. Builds with wrangler (reads bindings from cf/wrangler.toml) and pushes
# straight to Cloudflare — no local token needed, so token IP-filtering is a
# non-issue here.
#
# Secret required in the GitHub repo:
#   CF_API_TOKEN = Cloudflare API token that can edit the "jarvis-sovereign"
#                  Worker (Workers Scripts: Edit) AND D1 (account-scope).
#                  Ideally NOT IP-restricted, since GitHub runner IPs rotate.
#
# Optional secrets (fall back to wrangler.toml [vars] if unset):
#   CF_ACCOUNT_ID = the account id (CF_ACCOUNT_ID_REDACTED)

name: Deploy Worker to Cloudflare

# SAFETY GATE: deploys run only when the repo is the source of truth.
# The GitHub repo is now the single authoritative source for the Cloudflare
# worker (verified byte-consistent with live 2026-09-17, version m9-v11.51).
# Auto-deploy fires on push to main that touches cf/** (or this workflow), so a
# README/SUMMARY-only commit never deploys a stale worker. Manual
# `workflow_dispatch` still available for emergency/diagnostic deploys.
#
# D1 MIGRATIONS ARE NOW LEDGER-GATED. Previously they were applied ad-hoc with
# `wrangler d1 execute --file`, which keeps no record of what has run, so it
# cannot tell "already applied" from "never applied" and is not re-runnable.
#   * The workflow calls `cf/scripts/d1_migrate.sh`, which creates the
#     d1_migrations ledger when absent and records 0001-0020 as applied only
#     if the ledger is empty. Without that baseline, `migrations apply` would
#     replay 0001-0020 and die on the first `ALTER TABLE ADD COLUMN` with
#     "duplicate column name" (13 such statements exist across 8 tables).
#   * The script is idempotent, so it is safe on every deploy. A newly added
#     migrations/NNNN_*.sql is applied automatically instead of forgotten.
#     No operator action is required, which matters because there is no
#     laptop in this setup to run wrangler from.
on:
  push:
    branches: [main]
    paths:
      - "cf/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: cf-deploy
  cancel-in-progress: true

defaults:
  run:
    working-directory: cf

jobs:
  deploy:
    name: Build & Deploy jarvis-sovereign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Setup Go (wasm module build + parity tests)
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: cf/gomod/go.sum

      - name: Type-check
        run: npm run typecheck

      - name: Run safety tests
        run: npm run test:safety
      - name: Moderation gates
        run: npm run test:moderation
      - name: Telegram menu registration
        run: npm run test:menu
      - name: Telegram context gate
        run: npm run test:ctx
      - name: Two-model answer/verify gate
        run: npm run test:twomodel
      - name: Go/wasm module (parity + size budget)
        run: npm run test:go

      # Migrations run BEFORE the worker deploy.
      #
      # scripts/d1_migrate.sh is idempotent and safe on every deploy: it creates
      # the d1_migrations ledger if absent, records 0001-0020 as applied only
      # when the ledger is empty (they ARE applied in this database), then runs
      # `wrangler d1 migrations apply`, which then only executes new files.
      #
      # This replaces the previous hand-run procedure, which is impossible in a
      # laptop-free setup: `deploy.yml` used to skip migrations entirely and
      # rely on an operator running `wrangler d1 execute --file` somewhere.
      - name: Apply D1 migrations (idempotent, ledger-gated)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: bash scripts/d1_migrate.sh

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || vars.CF_ACCOUNT_ID }}
        run: npx wrangler deploy