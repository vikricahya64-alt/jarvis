# =====================================================================
# jarvis-delegate.yml — serverless executor for J.A.R.V.I.S.
#
# JARVIS (Cloudflare free tier) can't run arbitrary processes, so heavy
# digital-work tasks are delegated here: an EPHEMERAL GitHub VM (repo is
# PUBLIC → Actions minutes UNLIMITED & FREE) installs `opencode` headless
# and runs it against the SAME OpenRouter provider JARVIS already uses
# (zero extra cost). Results POST back to /agent/done, which DMs the owner.
#
# Triggered by the worker via GitHub repository_dispatch ("jarvis-task").
# Auth: AGENT_TOKEN repo secret (same value as the worker's secret).
# LLM key: GROQ_API_KEY repo secret (per-key free tier → reliable on shared
# runner IPs), fallback OPENROUTER_API_KEY (already in use by JARVIS).
# =====================================================================
name: jarvis-delegate

on:
  repository_dispatch:
    types: [jarvis-task]

# Public repo → unlimited minutes; still serialize to avoid resource fights.
concurrency:
  group: jarvis-agent
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install opencode (headless)
        run: |
          npm install -g opencode-ai
          opencode --version

      # Task text is passed via env var (never glued into a shell string),
      # so owner input can't inject shell commands into the runner.
      - name: Materialize task
        env:
          TASK: ${{ github.event.client_payload.task }}
        run: printf '%s' "$TASK" > /tmp/task.txt

      # Lampiran (B1, dokumen): when the task embeds a <dlurl:...> marker, the
      # file is pulled down into /tmp (Cloudflare's sandbox can't parse
      # xlsx/pdf/docx well; the ephemeral VM can). The marker is stripped so
      # its per-file secret never reaches prompts/logs, and the resolved path
      # is appended so opencode knows exactly what to read.
      - name: Download lampiran (if any)
        run: |
          URI="$(grep -o '<dlurl:[^>]*>' /tmp/task.txt | head -1 || true)"
          if [ -n "$URI" ]; then
            URL="${URI#<dlurl:}"; URL="${URL%>}"
            EXT="$(cat /tmp/task.txt | sed -n 's/.*lampiran *"\([^"]*\.\([A-Za-z0-9]\{1,5\}\)\)".*/\2/p' | head -1)"
            [ -n "$EXT" ] || EXT="bin"
            echo "lampiran url=${URL:0:60}… ext=$EXT"
            if curl -fsSL --max-time 60 "$URL" -o "/tmp/lampiran.$EXT"; then
              sed -i 's#<dlurl:[^>]*>##' /tmp/task.txt
              printf '\n[LAMPIRAN] Baca berkas /tmp/lampiran.'"$EXT"' — itulah lampiran yang harus dianalisis. Jangan hapus berkasnya.' >> /tmp/task.txt
              echo "lampiran: /tmp/lampiran.$EXT ($(stat -c%s "/tmp/lampiran.$EXT") bytes)"
            else
              echo "warn: lampiran download gagal — lanjut tanpa file"
            fi
          else
            echo "lampiran: none"
          fi

      - name: Run opencode agent
        id: exec
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL || 'openai/gpt-oss-120b' }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL || 'google/gemma-4-31b-it:free' }}
        run: |
          set +e
          if [ -n "$GROQ_API_KEY" ]; then
            PROVIDER=groq; MODEL="$GROQ_MODEL"
          elif [ -n "$OPENROUTER_API_KEY" ]; then
            PROVIDER=openrouter; MODEL="$OPENROUTER_MODEL"
          else
            echo "ERR: tidak ada LLM key (GROQ/OpenRouter) di repo secrets." > /tmp/jarvis-out.txt
            code=1
            PROVIDER=groq; MODEL=unset
          fi
          if [ "$PROVIDER" != "unset" ]; then
            # Transient upstream rate-limits possible on shared runner IPs →
            # retry with backoff before giving up. Groq (per-key) is primary.
            # opencode headless mem-BLOKIR tool-call tanpa persetujuan interaktif.
            # --dangerously-skip-permissions: input task CUMAN dari owner
            # (owner_id dicek worker), VM ephemeral & dibuang tiap run → aman.
            code=1
            for attempt in 1 2 3; do
              opencode run --dangerously-skip-permissions --model "$PROVIDER/$MODEL" "$(cat /tmp/task.txt)" > /tmp/jarvis-out.txt 2>&1
              code=$?
              if [ "$code" = "0" ]; then break; fi
              echo "attempt $attempt: $PROVIDER/$MODEL exit=$code -> retry" >&2
              sleep $((attempt * 25))
            done
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Archive artifact (commit to repo, public = free)
        id: archive
        env:
          TASK_ID: ${{ github.event.client_payload.task_id }}
        run: |
          # Clean ANSI so the stored deliverable is readable plain text.
          sed -e $'s/\\033\[[0-9;]*[A-Za-z]//g' /tmp/jarvis-out.txt > /tmp/jarvis-artifact.md
          mkdir -p artifacts
          cp /tmp/jarvis-artifact.md "artifacts/task_${TASK_ID}.md"
          git add "artifacts/task_${TASK_ID}.md"
          git -c user.name="${{ github.actor }}" -c user.email="${{ github.actor }}@users.noreply.github.com" commit -q -m "artifact(task_$TASK_ID): opencode execution output" || true
          git push -q || true
          echo "artifact_url=https://github.com/${{ github.repository }}/blob/main/artifacts/task_${TASK_ID}.md" >> "$GITHUB_OUTPUT"

      - name: Report result back to JARVIS
        env:
          AGENT_TOKEN: ${{ secrets.AGENT_TOKEN }}
          WORKER: "https://jarvis-sovereign.vikricahya64.workers.dev"
          TASK_ID: ${{ github.event.client_payload.task_id }}
          ARTIFACT: ${{ steps.archive.outputs.artifact_url }}
        run: |
          EXIT_CODE="${{ steps.exec.outputs.exit_code }}"
          if [ -z "$EXIT_CODE" ]; then EXIT_CODE=1; fi
          if [ "$EXIT_CODE" = "0" ]; then
            JSON="$(jq -nc --arg id "$TASK_ID" --arg r "$(head -c 60000 /tmp/jarvis-out.txt)" --arg u "$ARTIFACT" \
              '{task_id:($id|tonumber), status:"done", result:$r, artifact_url:$u}')"
          else
            JSON="$(jq -nc --arg id "$TASK_ID" --arg e "$(head -c 3000 /tmp/jarvis-out.txt)" --arg u "$ARTIFACT" \
              '{task_id:($id|tonumber), status:"failed", result:"", error:$e, artifact_url:$u}')"
          fi
          curl -fsS --max-time 30 -X POST "$WORKER/agent/done?token=$AGENT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$JSON"