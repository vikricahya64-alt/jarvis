name: predictive-triggers

on:
  schedule:
    # Every 30 minutes — maintenance sweep (memory/proposal TTL + stale
    # executor guard) against the CURRENT Cloudflare worker. Replaces the old
    # trigger that woke a legacy Vercel analytics app JARVIS no longer uses.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: predictive-triggers
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/worker-cron
        with:
          mode: cleanup
          message: "⚠️ Predictive sweep JARVIS gagal (repo workflow predictive-triggers)."