name: predictive-triggers

on:
  schedule:
    # Every 30 minutes — maintenance sweep (memory/proposal TTL + stale
    # executor guard) against the CURRENT Cloudflare worker. Replaces the old
    # trigger that woke a legacy Vercel analytics app JARVIS no longer uses.
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: predictive-triggers
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Run maintenance sweep (Cloudflare worker)
        id: predict
        run: |
          status=$(curl -s -o /tmp/predict_body.json -w "%{http_code}" \
            -X POST "https://jarvis-sovereign.vikricahya64.workers.dev/cron/trigger?mode=cleanup" \
            -H "x-agent-token: ${{ secrets.AGENT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "sweep HTTP $status: $(cat /tmp/predict_body.json)"
          if [ "$status" -ne 200 ]; then
            echo "maintenance sweep failed with HTTP $status" >&2
            exit 1
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$OWNER_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$OWNER_CHAT_ID" \
              -d text="⚠️ Predictive sweep JARVIS gagal (repo workflow predictive-triggers)." >/dev/null
          else
            echo "TELEGRAM_TOKEN/OWNER_CHAT_ID secrets absent - skipping notify"
          fi
