name: Deploy Legacy (Vercel)

# Auto-deploy for vercel-leg, the LEGACY Python/Vercel stack.
#
# Kept separate from deploy.yml on purpose. The Cloudflare Worker is the live
# spine; vercel-leg is the fallback. Sharing one workflow would mean a Vercel
# build failure blocking a Cloudflare deploy that has nothing to do with it, and
# vice versa - and this repo had four consecutive failed deploys before anyone
# noticed, because the Vercel check was red the whole time and unrelated to the
# Cloudflare path.
#
# Path filter matches deploy.yml's shape: a README-only commit must not trigger
# a rebuild of either stack.
#
# The build used to fail for weeks with FASTAPI_ENTRYPOINT_NOT_FOUND. Two causes,
# both now fixed:
#   * the project had framework=fastapi, so wrangler-style FastAPI export was
#     demanded. The stack is a set of BaseHTTPRequestHandler functions, not an
#     ASGI app.
#   * rootDirectory was unset, so Vercel built the repo root while
#     requirements.txt and vercel.json both live in vercel-leg/.
# Both are project settings (rootDirectory=vercel-leg, framework=null), not repo
# settings, so they cannot be encoded in this file - only applied once via the
# API. That is why this workflow cannot fully re-create a project from scratch.
on:
  push:
    branches: [main]
    paths:
      - "vercel-leg/**"
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-deploy
  # false, not true: a deploy already in flight should finish. Cancelling
  # mid-deploy can leave the project pointed at a half-built deployment.
  cancel-in-progress: false

env:
  # Pinned deliberately. vercel@latest made every deploy pull whatever was newest
  # that day, so a green run was not reproducible and a bad release could break
  # production deploys with no change on our side. Verified against the version
  # this workflow was last passing with.
  VERCEL_CLI_VERSION: 62.7.0

jobs:
  deploy:
    name: vercel pull + build + deploy
    runs-on: ubuntu-latest
    # Serverless function builds plus a pip install of groq/e2b/cryptography can
    # exceed the 360s default on a cold runner.
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # `vercel pull` is what links the checkout to the project without an
      # interactive prompt: it reads VERCEL_ORG_ID and VERCEL_PROJECT_ID and
      # writes .vercel/project.json. Without it the CLI prompts for a scope and
      # hangs until the job times out.
      - name: Link project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' \
            "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
          # Sanity-check the token before spending build minutes.
          who="$(curl -sS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
                   https://api.vercel.com/v2/user | tr -d '\n')"
          if ! printf '%s' "$who" | grep -q '"id"'; then
            echo "::error::VERCEL_TOKEN is not usable"; exit 1
          fi
          echo "linked project=$VERCEL_PROJECT_ID org=$VERCEL_ORG_ID"

      - name: Pull environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Vercel's Python runtime builds dependencies with uv and refuses to
      # start without it: "Error: uv is required but was not found in PATH."
      # GitHub's runner does not ship it, and `pip install` is enough - uv
      # itself then installs the Python deps declared in
      # vercel-leg/requirements.txt.
      - name: Install uv
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip uv
          uv --version

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # Prove the deployment actually answers, and that the endpoints which
      # previously had no authentication at all are refused.
      #
      # Two things this deliberately does NOT do:
      #
      #   * It does not check the per-deployment URL. Deployment Protection
      #     (Vercel Authentication) is on for this project, so that URL answers
      #     302 and a check against it would prove nothing. Vercel's own CLI
      #     output says as much: "Deployment Protection is on ... use vercel curl".
      #   * It does not parse the CLI output to find the URL. `vercel inspect`
      #     exited non-zero, and under `set -euo pipefail` that aborted the step
      #     before any assertion ran - a green build followed by a silent skip.
      #
      # It checks the production alias instead, which is the surface that
      # actually matters: this project is configured
      # ssoProtection=all_except_custom_domains, so its custom domain answers
      # with no Vercel Authentication at all. That is where the unauthenticated
      # endpoints were reachable, so that is where they must be probed.
      - name: Verify the deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -uo pipefail
          BASE="https://jarvis-sigma-navy-gamma.vercel.app"

          # Resolve the production alias from the API; fall back to the known one.
          alias="$(curl -sS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=1&target=production" \
            2>/dev/null | python3 -c 'import json,sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              sys.exit(0)
          deps = d.get("deployments") or []
          if not deps:
              sys.exit(0)
          for a in deps[0].get("alias") or []:
              if a and "git-" not in a:
                  print(a); break
          ' 2>/dev/null || true)"
          if [ -n "$alias" ]; then
            BASE="https://${alias}"
          fi
          echo "probing: $BASE"

          health="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 40 "$BASE/api/health" 2>/dev/null || echo 000)"
          echo "  GET  /api/health                  -> $health"
          if [ "$health" != "200" ]; then
            echo "::error::health check returned $health"
            exit 1
          fi

          # These run caller-supplied code and spend the owner's LLM quota. They
          # had no authentication at all until commit ae0bdea. 200 or 302 means
          # the gate regressed.
          fail=0
          for ep in orchestrator simulator_proxy; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 40 \
              -X POST "$BASE/api/$ep" \
              -H 'Content-Type: application/json' \
              -d '{"input":"x","code":"print(1)","telegram_id":1}' 2>/dev/null || echo 000)"
            echo "  POST /api/$ep (no token)        -> $code"
            [ "$code" = "401" ] || { echo "::error::$ep returned $code, expected 401"; fail=1; }
          done

          # And the wrong token must still be refused, not just a missing one.
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 40 \
            -X POST "$BASE/api/orchestrator" \
            -H 'X-Internal-Auth: definitely-wrong' -H 'Content-Type: application/json' \
            -d '{"input":"x"}' 2>/dev/null || echo 000)"
          echo "  POST /api/orchestrator (bad token) -> $code"
          [ "$code" = "401" ] || { echo "::error::wrong token returned $code, expected 401"; fail=1; }

          [ "$fail" = "0" ] || exit 1
          echo "verification OK"
