# CI on pull requests: static + behavior gates for the Cloudflare worker.
# Deploys stay manual (workflow_dispatch only) — see deploy.yml's SAFETY GATE.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cf

jobs:
  check:
    name: Typecheck + logic + safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - name: Install dependencies
        run: npm ci
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: cf/gomod/go.sum

      - name: Type-check (src only; tests run via tsx)
        run: npm run typecheck

      - name: Moderation tests
        run: npm run test:moderation
      - name: Telegram menu
        run: npm run test:menu
      - name: Telegram context gate
        run: npm run test:ctx
      - name: Two-model answer/verify gate
        run: npm run test:twomodel
      - name: Answer continuation
        run: npm run test:continuation
      - name: Output readability gate
        run: npm run test:readability
      - name: Go/wasm module (parity + size budget)
        run: npm run test:go

      - name: Logic tests
        run: npm run test:logic

      - name: Safety tests
        run: npm run test:safety