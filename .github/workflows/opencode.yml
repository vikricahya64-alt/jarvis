# Run opencode against a user prompt and deliver the result to Telegram.
# Triggered via workflow_dispatch from JARVIS /opencode command.
#
# Secrets required in the GitHub repo:
#   TELEGRAM_TOKEN       — Bot token (same as JARVIS) for delivering results
#   OPENROUTER_API_KEY   — JARVIS's OpenRouter key; grants access to many
#                          :free models (100% free, no extra cost).
#   GROQ_API_KEY         — (fallback candidate) JARVIS's Groq key, free tier.
# Optional secrets/vars:
#   OPENCODE_MODEL       — model id in "provider/model" form (default:
#                          openrouter/nvidia/nemotron-3-super-120b-a12b:free,
#                          a strong free OpenRouter model). Set vars to override.

name: opencode

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "The prompt to send to opencode"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID to deliver the result"
        required: true
        type: string

concurrency:
  group: opencode
  cancel-in-progress: true

jobs:
  run:
    name: Run opencode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Clear server-auth vars that cause "Session not found" bugs in headless
      # `opencode run` (see anomalyco/opencode#28407 / #13221).
      OPENCODE_SERVER_PASSWORD: ""
      OPENCODE_SERVER_USERNAME: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Resolve model
        id: model
        run: |
          MODEL="${{ vars.OPENCODE_MODEL }}"
          if [ -z "$MODEL" ]; then MODEL="openrouter/nvidia/nemotron-3-super-120b-a12b:free"; fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Anggota model: $MODEL"

      - name: Run opencode
        id: oc
        run: |
          : > /tmp/oc_result.txt
          set +e
          RESULT=$(opencode run \
            --model "${{ steps.model.outputs.model }}" \
            "${{ inputs.prompt }}" 2>&1)
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            RESULT="(opencode keluar dengan kode $CODE — cek API key/model)\n${RESULT}"
          fi
          # Truncate to Telegram's 4096-char limit, guard character.
          if [ ${#RESULT} -gt 4000 ]; then
            RESULT="${RESULT:0:4000}… (dipotong)"
          fi
          printf '%s' "$RESULT" > /tmp/oc_result.txt
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Send result to Telegram
        run: |
          TEXT=$(cat /tmp/oc_result.txt)
          # JSON-encode so arbitrary content survives sendMessage safely.
          python3 - "${{ inputs.chat_id }}" "$TEXT" <<'PY'
          import json, os, subprocess, sys
          chat_id = sys.argv[1]
          text = sys.argv[2]
          payload = {"chat_id": chat_id, "text": text, "parse_mode": "HTML"}
          subprocess.run([
            "curl", "-s", "-X", "POST",
            f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
            "-H", "Content-Type: application/json",
            "-d", json.dumps(payload).encode("utf-8"),
          ], check=False)
          PY
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
