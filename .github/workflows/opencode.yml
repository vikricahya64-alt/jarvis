# Run opencode against a user prompt and deliver the result to Telegram.
# Triggered via workflow_dispatch from JARVIS /opencode command.
#
# Secrets required in the GitHub repo:
#   TELEGRAM_TOKEN       — Bot token (same as JARVIS) for delivering results
#   OPENROUTER_API_KEY   — JARVIS's OpenRouter key; grants access to many
#                          :free models (100% free, no extra cost).
#   GROQ_API_KEY         — (fallback candidate) JARVIS's Groq key, free tier.
# Optional secrets/vars:
#   OPENCODE_MODEL       — model id in "provider/model" form (default:
#                          openrouter/nvidia/nemotron-3-super-120b-a12b:free,
#                          a strong free OpenRouter model). Set vars to override.

name: opencode

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "The prompt to send to opencode"
        required: true
        type: string
      chat_id:
        description: "Telegram chat ID to deliver the result"
        required: true
        type: string
      mode:
        description: "chat (reply only) | analyze (read-only analysis) | edit (modify repo + open PR)"
        required: false
        default: chat
        type: choice
        options:
          - chat
          - analyze
          - edit

concurrency:
  group: opencode
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    name: Run opencode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Clear server-auth vars that cause "Session not found" bugs in headless
      # `opencode run` (see anomalyco/opencode#28407 / #13221).
      OPENCODE_SERVER_PASSWORD: ""
      OPENCODE_SERVER_USERNAME: ""
      # Pass the user prompt through an env var instead of shell interpolation:
      # ${{ inputs.prompt }} is inlined as literal text and breaks on quotes/
      # backticks, while the runtime expansion "$OC_PROMPT" is never re-parsed.
      OC_PROMPT: ${{ inputs.prompt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create working branch (edit mode only)
        id: workbranch
        if: inputs.mode == 'edit'
        run: |
          BRANCH="oc/auto-$(date +%s)"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install opencode
        run: npm install -g opencode-ai

      - name: Resolve model
        id: model
        run: |
          MODEL="${{ vars.OPENCODE_MODEL }}"
          if [ -z "$MODEL" ]; then MODEL="openrouter/nvidia/nemotron-3-super-120b-a12b:free"; fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Anggota model: $MODEL"

      - name: Run opencode
        id: oc
        run: |
          : > /tmp/oc_result.txt
          set +e
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "edit" ]; then
            RESULT=$(opencode run \
              --model "${{ steps.model.outputs.model }}" \
              --dangerously-skip-permissions \
              "$OC_PROMPT" 2>&1)
          elif [ "$MODE" = "analyze" ]; then
            RESULT=$(opencode run \
              --model "${{ steps.model.outputs.model }}" \
              --agent plan \
              "$OC_PROMPT" 2>&1)
          else
            RESULT=$(opencode run \
              --model "${{ steps.model.outputs.model }}" \
              "$OC_PROMPT" 2>&1)
          fi
          CODE=$?
          set -e
          if [ $CODE -ne 0 ]; then
            RESULT="(opencode keluar dengan kode $CODE — cek API key/model)\n${RESULT}"
          fi
          # Truncate to Telegram's 4096-char limit.
          if [ ${#RESULT} -gt 3500 ]; then
            RESULT="${RESULT:0:3500}… (dipotong)"
          fi
          printf '%s' "$RESULT" > /tmp/oc_result.txt
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Commit & open PR (edit mode only)
        if: inputs.mode == 'edit'
        run: |
          set +e
          git add -A
          git diff --cached --quiet
          CHANGED=$?
          set -e
          if [ $CHANGED -ne 0 ]; then
          git config user.name "JARVIS opencode bot"
          git config user.email "jarvis-opencode@users.noreply.github.com"
          python3 - <<'PY'
          import os
          p = os.environ["OC_PROMPT"]
          open("/tmp/oc_commit.txt", "w").write(("feat(oc): " + p)[:200])
          open("/tmp/oc_title.txt", "w").write(("oc: " + p)[:60])
          open("/tmp/oc_body.md", "w").write("Dari Telegram oleh opencode.\n```" + p + "```\n")
          PY
          git commit -F /tmp/oc_commit.txt
          git push -u origin "${{ steps.workbranch.outputs.branch }}"
          PR_URL=$(gh pr create --title "$(cat /tmp/oc_title.txt)" --body-file /tmp/oc_body.md | tail -1)
          echo "$PR_URL" >> /tmp/oc_result.txt
          echo "  (review & merge manual sebelum deploy)" >> /tmp/oc_result.txt
          else
          echo "  (tidak ada perubahan file — hanya balasan teks di atas)" >> /tmp/oc_result.txt
          fi
          cat /tmp/oc_result.txt
        env:
          # GITHUB_TOKEN cannot create PRs; use a PAT (OC_PAT) which can.
          GH_TOKEN: ${{ secrets.OC_PAT }}
          PB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send result to Telegram
        run: |
          TEXT=$(cat /tmp/oc_result.txt)
          # JSON-encode so arbitrary content survives sendMessage safely.
          python3 - "${{ inputs.chat_id }}" "$TEXT" <<'PY'
          import json, os, subprocess, sys
          chat_id = sys.argv[1]
          text = sys.argv[2]
          payload = {"chat_id": chat_id, "text": text, "parse_mode": "HTML"}
          subprocess.run([
            "curl", "-s", "-X", "POST",
            f"https://api.telegram.org/bot{os.environ['TELEGRAM_TOKEN']}/sendMessage",
            "-H", "Content-Type: application/json",
            "-d", json.dumps(payload).encode("utf-8"),
          ], check=False)
          PY
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
