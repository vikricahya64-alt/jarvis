# =====================================================================
# d1-backup.yml — scheduled D1 export.
#
# The audit found NO backup anywhere: nothing in any workflow exported the
# database, while it holds the only durable record of conversation turns,
# memories, plans, obedience audit, provider health and deploy history. A
# mistaken DELETE or a bad migration is currently unrecoverable, and the
# restore path was "rewrite it from the logs", which is not a restore.
#
# D1 export is a first-class Cloudflare feature (wrangler d1 export), so this
# needs no new dependency. What it does need is somewhere to put the result:
# committed to the repository. That is deliberate for this deployment:
#   - the repo is public, so a nightly artifact commit is free Actions minutes
#   - R2 or any object store would mean another credential to rotate, and the
#     credential sprawl is exactly what has caused drift twice already
#     (AGENT_TOKEN, GROQ_API_KEY)
#   - history keeps a dated copy per day, which is a usable restore point
#
# Caveat recorded rather than hidden: this is repository-hosted backup. It is
# not a substitute for a real off-site copy for a private repo, and it is not
# point-in-time recovery - it is nightly. The first month of retention is the
# whole history, so disk is not yet a concern.
name: d1-backup

on:
  schedule:
    # 02:17 UTC - deliberately off the hour. Every workflow in this repo that
    # fires on the hour competes for the same runner pool at :00, and this one
    # is the least latency-sensitive thing in the repository.
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. With the default shallow clone this workflow cannot
          # rebase, so once main moves the nightly push is rejected as
          # non-fast-forward and the backup silently stops being written -
          # while the export itself still succeeds and looks fine.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf/package-lock.json

      - name: Install dependencies
        # The lockfile lives in cf/, so npm must run there. Running it at the
        # repo root fails every time with no package-lock.json - which is what
        # happened every night until this was actually dispatched once.
        working-directory: cf
        run: npm ci

      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd cf
          mkdir -p ../backups/d1
          STAMP="$(date -u +%Y-%m-%dT%H%MZ)"
          OUT="../backups/d1/jarvis-${STAMP}.json"

          # `wrangler d1 export` CANNOT be used here. Verified:
          #   D1 Export error: cannot export databases with virtual tables (like FTS5)
          # and this database has memories_fts, an FTS5 index. A workflow that
          # relied on it would have failed every single night while looking
          # configured.
          #
          # So this walks the real tables instead. Virtual tables are skipped and
          # that costs nothing: memories_fts is a search index over memories, so
          # it is rebuilt from the memories rows in this same dump.
          #
          # Rows go out as JSON, which is immune to the quoting and delimiter
          # problems a hand-built .sql dump would have.
          npx wrangler d1 execute jarvis --remote --json \
            --command "SELECT name, sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'" \
            > /tmp/schema.json

          python3 - "$OUT" <<'PYEOF'
          import json, subprocess, sys, datetime, pathlib

          out = pathlib.Path(sys.argv[1])
          schema = json.loads(pathlib.Path("/tmp/schema.json").read_text())
          tables = [r["name"] for r in schema[0]["results"]]
          # An FTS5 virtual table's CREATE statement references modules and
          # shadow tables; skip it and the shadow tables with it.
          # _cf_KV is Cloudflare's own KV index, not application data. Reading it
          # is refused by the engine - verified:
          #   access to _cf_KV.key is prohibited: SQLITE_AUTH [code: 7500]
          # So it can never be exported and never needed to be. It is excluded
          # by name so it stops appearing as a failed table and so a failure
          # count stays a real signal rather than a permanent false positive.
          INTERNAL = {"_cf_KV"}
          real = [t for t in tables
                  if t not in INTERNAL
                  and not t.endswith("_fts")
                  and not t.endswith("_fts_data")
                  and not t.endswith("_fts_idx")
                  and not t.endswith("_fts_docsize")
                  and not t.endswith("_fts_config")]

          dump = {
            "exported_at": datetime.datetime.utcnow().isoformat() + "Z",
            "method": "per-table JSON (wrangler d1 export is blocked by FTS5)",
            "skipped_virtual": sorted(set(tables) - set(real)),
            "skipped_internal": sorted(set(tables) & INTERNAL),
            "tables": {},
          }
          for t in real:
              p = subprocess.run(
                  ["npx", "wrangler", "d1", "execute", "jarvis", "--remote", "--json",
                   "--command", f'SELECT * FROM "{t}"'],
                  capture_output=True, text=True,
              )
              try:
                  dump["tables"][t] = json.loads(p.stdout[p.stdout.find("["):])[0]["results"]
              except Exception:
                  dump["tables"][t] = None
                  print(f"  WARN: {t} gagal diekspor", file=sys.stderr)

          out.write_text(json.dumps(dump, indent=1, ensure_ascii=False))
          total = sum(len(v) for v in dump["tables"].values() if v is not None)
          print(f"  {len(real)} tabel, {total} baris, {out.stat().st_size} bytes")
          PYEOF

          if [ ! -s "$OUT" ]; then
            echo "::error::export produced an empty file" >&2
            exit 1
          fi
          # Silent-zero guard. A dump full of null tables is non-empty on disk,
          # so the -s check above passes it - but it restores to nothing. If every
          # table failed to export (auth, transient D1 error, wrangler drift),
          # this commits an empty backup that looks healthy every single night.
          # That is the exact failure that hid the delegation bug for a month.
          ROWS="$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sum(len(v) for v in d['tables'].values() if v is not None))" "$OUT")"
          FAILED="$(python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sum(1 for v in d['tables'].values() if v is None))" "$OUT")"
          echo "  rows=$ROWS failed_tables=$FAILED"
          if [ "$ROWS" -eq 0 ]; then
            echo "::error::export contains 0 rows across all tables (failed=$FAILED) - refusing to commit an empty backup" >&2
            exit 1
          fi

          # Keep the newest 30 dumps; older ones remain in git history, so this
          # bounds the working tree without losing any restore point.
          # find, not ls: under `set -o pipefail` a plain `ls ... 2>/dev/null`
          # still exits 2 when nothing matches yet, which kills the step via
          # set -e on the very first run - after a successful export, and before
          # LATEST or the commit. That is why run 1 produced 1975 rows and
          # still ended in failure.
          # Keep the newest 30 dumps. find with -printf is used deliberately:
          # under pipefail, a plain ls still exits 2 when the glob matches
          # nothing, which kills the step via set -e on the first run - after a
          # successful export and before LATEST or the commit.
          # NOTE: no backticks or nested quotes in these comments. A bash script
          # body runs command substitution even inside a comment.
          find ../backups/d1 -maxdepth 1 -name 'jarvis-*.json' -printf '%T@ %p\n' > /tmp/bk_listing 2>/dev/null || true
          sort -rn /tmp/bk_listing 2>/dev/null | tail -n +31 | cut -d' ' -f2- | xargs -r rm -f || true
          printf '%s' "$STAMP" > ../backups/d1/LATEST

      - name: Commit the dump
        run: |
          git config user.name  "d1-backup"
          git config user.email "d1-backup@users.noreply.github.com"
          git add -f backups/d1
          if git diff --cached --quiet; then
            echo "no change in dump; nothing to commit"
            exit 0
          fi
          git commit -q -m "chore(d1): nightly export $(cat backups/d1/LATEST)"
          # Not masked: a failed push must be visible, or this backup silently
          # stops existing while the job reports success. That is the same
          # failure mode that hid the delegation bug for a month.
          # Catch up with main before pushing, so a concurrent commit - another
          # workflow's artifact commit - cannot reject this push.
          git fetch origin main --quiet
          git rebase origin/main --quiet || {
            echo "::error::could not rebase the nightly dump onto main" >&2
            exit 1
          }
          git push origin HEAD:main