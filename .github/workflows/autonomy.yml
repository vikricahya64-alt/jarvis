name: autonomy

on:
  schedule:
    # Every 15 minutes. Vercel Hobby grants 2 crons/day, GitHub Actions
    # gives us unlimited free scheduled triggers instead.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: autonomy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Hit autonomous scheduler
        id: trigger
        run: |
          for i in 1 2 3; do
            status=$(curl -s -o /tmp/autonomy_body.json -w "%{http_code}" \
              -X POST https://jarvis-sigma-navy.vercel.app/api/cron-trigger \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d '{}')
            if [ "$status" -eq 200 ]; then
              echo "trigger ok: $(cat /tmp/autonomy_body.json)"
              exit 0
            fi
            echo "attempt $i failed with HTTP $status; retrying"
            sleep 20
          done
          echo "trigger failed after retries" >&2
          exit 1

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$OWNER_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$OWNER_CHAT_ID" \
              -d text="⚠️ Trigger otonom JARVIS gagal (repo workflow autonomy)." >/dev/null
          else
            echo "TELEGRAM_TOKEN/OWNER_CHAT_ID secrets absent - skipping notify"
          fi