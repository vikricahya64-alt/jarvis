name: autonomy

on:
  schedule:
    # Every 15 minutes. The Cloudflare worker keeps its 5 native cron slots
    # for core loops; this extra cadence runs the autonomy/maintenance pulse
    # (stale-executor guard + agent_tasks TTL) against the CURRENT worker.
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: autonomy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/worker-cron
        with:
          mode: autonomy
          message: "⚠️ Trigger otonom JARVIS gagal (repo workflow autonomy)."