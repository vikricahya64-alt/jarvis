name: worker-cron
description: >-
  Hit the JARVIS Cloudflare worker cron trigger with bounded retry, then
  notify the owner via Telegram when every attempt fails. Shared by the
  autonomous-maintenance schedules (autonomy / predictive-triggers).
inputs:
  mode:
    description: Cron mode passed to /cron/trigger (autonomy, cleanup, ...)
    required: true
  message:
    description: Telegram failure text (includes workflow label)
    required: true
runs:
  using: composite
  steps:
    - name: Hit worker cron trigger
      shell: bash
      run: |
        for i in 1 2 3; do
          status=$(curl -s -o /tmp/cron_body.json -w "%{http_code}" \
            -X POST "https://jarvis-sovereign.vikricahya64.workers.dev/cron/trigger?mode=${{ inputs.mode }}" \
            -H "x-agent-token: ${{ secrets.AGENT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          if [ "$status" -eq 200 ]; then
            echo "trigger ok: $(cat /tmp/cron_body.json)"
            exit 0
          fi
          echo "attempt $i failed with HTTP $status; retrying"
          sleep 20
        done
        echo "trigger failed after retries" >&2
        exit 1

    - name: Notify on failure
      if: failure()
      shell: bash
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        OWNER_CHAT_ID: ${{ secrets.OWNER_CHAT_ID }}
      run: |
        if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$OWNER_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="$OWNER_CHAT_ID" \
            -d text="${{ inputs.message }}" >/dev/null
        else
          echo "TELEGRAM_TOKEN/OWNER_CHAT_ID secrets absent - skipping notify"
        fi