#================================================================================
# J.A.R.V.I.S. — Level 10/11 Cloudflare-native sovereignty stack
#
# ONE Worker handles: Telegram webhook, cron daemons, queue consumer, health.
# This keeps the free-tier footprint small (1 worker, ≤5 cron triggers).
#
# Free tier realities (verified Jul 2026):
#   * Workers: 100k requests/day, 10ms CPU/req, 128MB, 50 subrequests.
#   * Cron: max 5 triggers/account; request-driven, NOT a resident daemon.
#   * D1: 5GB, 100k reads/day, 1M rows/table.
#   * R2 (NOT USED — needs a card to activate; payload stays INLINE in D1).
#   * Queues: 1M messages/month, consumer shares worker limits.
#   * KV: 1GB, 100k reads + 1k writes/day (config/certs, NOT audit log).
#   * Groq: ~14.4k req/day free (models vary).
#
# C25s edge note: the Realme stays a FULL edge node (terminal + LLM + DMS
# sensor) feeding the same activity table. Cloudflare D1 is the AUTHORITATIVE
# DMS decision engine; the worker scripts below are the mission-critical path.
#================================================================================
name = "jarvis-sovereign"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

#------------------------------------------------------------------------------
# Bindings: D1 (SQLite edge), Queue, KV
#------------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "jarvis"
database_id = "21da51ad-244e-46dc-9b5f-60e79ac60b25"

[[kv_namespaces]]
binding = "CONFIG_KV"
id = "c6476e44ee25411c88ba81aee3012e9c"

[[ai]]
binding = "AI"

# -----------------------------------------------------------------------------
# Queue bindings TEMPORARILY DISABLED: Cloudflare token lacks Queues:Edit
# permission, so `wrangler deploy` fails to attach the consumer (auth error
# 10000/10013). Worker still runs DMS + crons + webhook. Re-enable once a
# token with Queues access is available.
# [[queues.producers]]
# binding = "TASKS"
# queue = "jarvis-tasks"
#
# [[queues.consumers]]
# queue = "jarvis-tasks"
# max_batch_size = 10
# max_retries = 3
# dead_letter_queue = "jarvis-tasks-dlq"
#
# [[queues.producers]]
# binding = "TASKS_DEAD"
# queue = "jarvis-tasks-dlq"

#------------------------------------------------------------------------------
# Vars: non-secret configuration (secrets go in `wrangler secret put`)
#------------------------------------------------------------------------------
[vars]
OWNER_TELEGRAM_ID = "6812604983"
APP_ENV = "production"
# Telegram webhook secret (should be a secret, but kept here minimal for demo;
# in production use `wrangler secret put TELEGRAM_SECRET`).
CLARITY_GATE = "0.95"
RISK_CONSENT_THRESHOLD = "0.3"
CONSENT_TIMEOUT_S = "60"
DMS_GRACE_DAYS = "30"
DMS_STAGE1_HOURS = "24"
DMS_STAGE2_HOURS = "48"
QUEUE_RETRY_BACKOFF_MS = "1000"

#------------------------------------------------------------------------------
# Cron Triggers (≤5 allowed on free; request-driven daemons, not resident)
#   - DMS: every 6 hours   ("0 */6 * * *")
#   - Value alignment: daily 03:00 UTC   ("0 3 * * *")
#   - Obedience weekly report: Sunday 08:00 UTC   ("0 8 * * 0")
# The single Worker dispatches by scheduled cron name (see src/index.ts).
#------------------------------------------------------------------------------
[triggers]
crons = ["0 */6 * * *", "0 3 * * *", "0 8 * * *", "0 7 * * *"]