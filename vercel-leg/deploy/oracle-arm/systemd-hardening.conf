# Extra systemd hardening for additional protection. Merge manually into the
# [Service] block of jarvis-dms.service if you want stricter containment.
# Not part of the default unit because ProtectHome=true may hide files the
# monitor tries to read.

[Service]
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
ProtectClock=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
MemoryDenyWriteExecute=false
LockPersonality=true