# =============================================================================
# J.A.R.V.I.S. Level 10 — Ubiquitous Sentience (Fly.io)
# Primary: Singapore (sin) for Indonesia proximity.
# Failover regions: nrt (Tokyo), ord (Chicago).
# FREE TIER: max 3 shared-cpu-1x 256MB VMs + 3GB volume TOTAL. All region
# capacity must fit inside that. fly.toml declares the PRIMARY machine; extra
# failover machines are created on demand by ephemeral_worker/failover_manager
# and are destroyed when idle. Keep each instance at 256MB.
# =============================================================================
app = "jarvis-ubiquitous"

primary_region = "sin"

[build]
  # Multi-stage Dockerfile (<150MB final image).
  dockerfile = "Dockerfile"

[env]
  FLY_REGION = "sin"
  PRIMARY_REGION = "sin"
  SUPABASE_URL = "https://vujhyhvmibdkartmrepv.supabase.co"
  # Keys/passphrases MUST come from `fly secrets set`, not here.
  LOG_LEVEL = "INFO"
  JARVIS_HEALTH_SKIP_DEPCHECK = "0"

[deploy]
  strategy = "rolling"
  max_unavailable = 1
  release_command = "mkdir -p /data/jarvis && chown jarvis:jarvis /data/jarvis"

[mounts]
  source = "jarvis_state"
  destination = "/data/jarvis"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  processes = ["app"]

# Primary HTTP service
[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]
  auto_stop_machines = true
  auto_start_machines = true

  [services.concurrency]
    type = "connections"
    hard_limit = 40
    soft_limit = 20

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"

  [[services.http_checks]]
    interval = "1m"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

# Health checks for the machine (container-level)
[checks]
  [checks.http_health]
    port = 8080
    type = "http"
    interval = "15s"
    timeout = "3s"
    path = "/healthz"

# Optional: internal WireGuard mesh only for inter-service (no public port).
# Inter-service calls use <svc>.internal DNS; only the webhook is public.
# Restrict cross-region via a scaled second machine created on demand — do NOT
# statically scale beyond free tier. Two on-demand failover machines (nrt/ord)
# are managed by tools/level10/failover.py live.