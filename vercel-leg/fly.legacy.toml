# Level 9 Legacy monitor app config (separate Fly app: `jarvis-legacy-monitor`).
# Kept so the 24/7 dead-man's-switch worker can still be deployed alongside the
# L10 main app. NOTE: Fly free tier allows only 3 VMs TOTAL; run this monitor
# as ONE of the three (primary = this legacy monitor, or trade with L10 app).
app = "jarvis-legacy-monitor"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  JARVIS_DMS_GRACE_DAYS = "30"
  JARVIS_MULTISIG_THRESHOLD = "2"
  JARVIS_TERMINATE_WINDOW_H = "72"
  JARVIS_DMS_EXECUTE = "0"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]
  [services.concurrency]
    type = "heavy"
    hard_limit = 1
    soft_limit = 1
  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true
  [[services.http_checks]]
    interval = "1m"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"